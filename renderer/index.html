<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white min-vh-100">

    <nav class="navbar navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <i class="fa-solid fa-gamepad text-warning fs-4"></i>
                Pokemon TCG API
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-3 mb-4 p-3 bg-black rounded shadow border border-secondary">
            <!-- Buscador -->
            <div class="col-12 col-md-4">
                <label for="input-search" class="form-label text-warning fw-bold small">
                    <i class="fa-solid fa-magnifying-glass me-1"></i> Buscar Carta
                </label>
                <input type="text" id="input-search" class="form-control bg-dark text-white border-secondary">
            </div>

            <!-- Filtro 1-->
            <div class="col-12 col-md-4">
                <label for="select-serie" class="form-label text-warning fw-bold small">
                    <i class="fa-solid fa-layer-group me-1"></i> Serie / Era
                </label>
                <select id="select-serie" class="form-select bg-dark text-white border-secondary">
                    <option value="todos">Todas las series</option>
                    <option value="sv">Escarlata y Púrpura</option>
                    <option value="swsh">Espada y Escudo</option>
                    <option value="sm">Sol y Luna</option>
                    <option value="xy">XY</option>
                    <option value="bw">Negro y Blanco</option>
                    <option value="base">Serie base (Original)</option>
                </select>
            </div>

            <!-- Filtro 2 -->
            <div class="col-12 col-md-4">
                <label for="select-image-filter" class="form-label text-warning fw-bold small">
                    <i class="fa-solid fa-image me-1"></i> Ilustración
                </label>
                <select id="select-image-filter" class="form-select bg-dark text-white border-secondary">
                    <option value="todos">Todas las cartas</option>
                    <option value="con-imagen" selected>Solo con ilustración</option>
                    <option value="sin-imagen">Sin ilustración preliminar</option>
                </select>
            </div>
        </div>

        <section class="d-flex align-items-center text-white my-5 p-4 bg-black rounded shadow border border-secondary"
            id="loading">
            <strong class="fs-5 me-3">Cargando cartas de Pokémon TCG...</strong>
            <div class="spinner-border text-warning ms-auto" role="status"></div>
        </section>

        <div class="row" id="card-dinamica">
            <template id="template-card">
                <article class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
                    <div class="card bg-black border-secondary text-white h-100 shadow">
                        <div
                            class="bg-dark border-bottom border-secondary p-2 text-center d-flex align-items-center justify-content-center">
                            <img src="" class="card-img-top img-fluid object-fit-contain w-100" alt="Pokémon Card"
                                loading="lazy">
                        </div>
                        <div class="card-body d-flex flex-column justify-content-between p-3">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-secondary">ID: <span class=" card-id">ID</span></span>

                                </div>
                                <h5 class="card-title text-warning fw-bold fs-6 mb-2">Nombre</h5>

                                <div>

                                    <span>Serie: <span class="fw-bold card-serie">Serie</span></span> 
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </div>
    <script src="src/script.js"></script>
</body>

</html>
